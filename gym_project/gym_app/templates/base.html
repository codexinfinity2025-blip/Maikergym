<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MaikerGym{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/maikergym-pro.css' %}?v=mobile-nav-v1">
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}

    <footer class="mg-footer">
        <div class="mg-footer-inner">
            <button class="mg-footer-brand" onclick="window.location.href='{% url 'inicio' %}'">MaikerGym</button>
            <nav class="mg-footer-links">
                <a href="{% url 'inicio' %}">Inicio</a>
                <a href="{% url 'escogenos' %}">Por qué nosotros</a>
                <a href="{% url 'precios' %}">Precios</a>
                <a href="{% url 'contacto' %}">Contacto</a>
            </nav>
            <p>© 2026 MaikerGym. Transformando objetivos en resultados.</p>
        </div>
    </footer>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'js/maikergym-motion.js' %}?v=mobile-nav-v1" defer></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
